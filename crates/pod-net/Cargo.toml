[package]
name = "pod-net"
version.workspace = true
edition.workspace = true

[features]
default = []
## Enable SpacetimeDB connection mode alongside direct-connect (QUIC/WebSocket).
## Adds `SpacetimeDBClient` adapter that bridges pod-stdb::client into pod-net's
## message/event paradigm.
spacetimedb = ["pod-stdb"]

[dependencies]
pod-core = { path = "../pod-core" }
pod-stdb = { path = "../pod-stdb", default-features = false, features = ["client"], optional = true }
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
log.workspace = true
tokio.workspace = true
quinn.workspace = true
uuid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "ErrorEvent", "CloseEvent", "BinaryType"] }
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "network_performance"
harness = false
