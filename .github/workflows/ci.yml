name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test
        run: cargo test --workspace

      - name: Cargo clippy
        run: cargo clippy --workspace -- -D warnings

  browser-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Pod Render browser bridge tests
        run: cargo test -p pod-render --lib

      - name: Pod Render wasm compatibility check
        run: cargo check -p pod-render --target wasm32-unknown-unknown

  pod-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/pod-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install pod-web dependencies
        run: bun install --frozen-lockfile

      - name: pod-web generated asset validation
        run: bun run verify:assets

      - name: pod-web typecheck
        run: bun run typecheck

      - name: pod-web unit tests
        run: bun test

      - name: pod-web build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: pod-web render-route measurements
        run: bun run measure:render-routes:check

      - name: pod-web smoke tests
        run: bun run test:smoke

      - name: Upload pod-web browser artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pod-web-browser-artifacts
          path: |
            apps/pod-web/artifacts/render-route-measurements.json
            apps/pod-web/artifacts/staged-assets/pod-runtime-budget-report.json

  moat-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify CLI surface catalog
        run: |
          bun test scripts/pod.test.ts scripts/verify_cli_surface.test.ts
          bun ./scripts/verify_cli_surface.ts --check

      - name: Install pod-web dependencies
        working-directory: apps/pod-web
        run: bun install --frozen-lockfile

      - name: Run moat benchmark smoke suite
        run: bun ./scripts/run_moat_benchmarks.ts --profile ci-smoke --skip-browser --output artifacts/moat-benchmarks-ci.json

      - name: Upload moat benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: moat-benchmarks-ci
          path: artifacts/moat-benchmarks-ci.json
